name: Build Kitab Scan APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Download OCR Arabic models
      - name: Unduh Model OCR
        run: |
          mkdir -p app/src/main/assets/ocr

          BASE=https://huggingface.co/monkt/paddleocr-onnx/resolve/main

          curl -L --fail --retry 3 \
            -o app/src/main/assets/ocr/det.onnx \
            $BASE/detection/v3/det.onnx

          curl -L --fail --retry 3 \
            -o app/src/main/assets/ocr/rec.onnx \
            $BASE/languages/arabic/rec.onnx

          curl -L --fail --retry 3 \
            -o app/src/main/assets/ocr/dict.txt \
            $BASE/languages/arabic/dict.txt

          echo "Model OCR berhasil diunduh:"
          ls -lh app/src/main/assets/ocr/

      # 5. Build APK
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 6. Verify APK
      - name: Verifikasi APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk

          test -f "$APK"

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      # 7. Compress APK
      - name: Kompres APK ke ZIP
        run: |
          cd app/build/outputs/apk/debug

          zip -9 kitab-scan.zip app-debug.apk

          echo "Ukuran hasil kompres:"
          ls -lh kitab-scan.zip

      # 8. Publish Release
      - name: Upload ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest
          ZIP=app/build/outputs/apk/debug/kitab-scan.zip

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$ZIP" \
            --title "Kitab Scan APK Terbaru" \
            --notes "Build otomatis
          
          Commit: ${{ github.sha }}

          File: kitab-scan.zip
          Ekstrak ZIP sebelum instalasi." \
            --prerelease

      # 9. Download URL
      - name: Informasi Download
        run: |
          echo "================================"
          echo "BUILD BERHASIL"
          echo "================================"
          echo "Download:"
          echo "https://github.com/${{ github.repository }}/releases/download/latest/kitab-scan.zip"